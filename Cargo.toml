[package]
name = "sochain-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for SoChain: Bitcoin, Litecoin, Dogecoin and Zcash blockchain data"
repository = "https://github.com/BlockIo/sochain-cli"
homepage = "https://sochain.com"
readme = "README.md"
keywords = ["bitcoin", "litecoin", "dogecoin", "zcash", "cli"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
license = "MIT"
authors = ["Block.io, Inc."]

[[bin]]
name = "sochain"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
sha2 = "0.11"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
