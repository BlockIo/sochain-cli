# Publishes the npm package. Called by release.yml, or run by hand for a tag.
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.1
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the npm package from this run
        if: ${{ inputs.plan != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true

      - name: Fetch the npm package from the GitHub release
        if: ${{ inputs.plan == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-npm-package.tar.gz' --dir npm/

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install --global npm@latest

      - name: Publish
        run: |
          npm --version
          shopt -s nullglob
          packages=(npm/*-npm-package.tar.gz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "no npm package found" >&2
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            npm stage publish --access public "./$pkg"
          done
