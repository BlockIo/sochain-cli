version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # release.yml is generated by `dist generate`; its actions are pinned in
    # dist-workspace.toml ([dist.github-action-commits]) and updated there.
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/setup-node
      - dependency-name: actions/attest
